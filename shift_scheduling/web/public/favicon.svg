<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ShiftPro">
  <!--
    The 16px optical cut of the mark: heavier strokes than logo-mark.svg and the
    two secondary bars dropped, because at tab-strip size they merge.
    brand-600 on light tab strips, brand-500 on dark ones.
  -->
  <style>
    .mark { stroke: #4f46e5; fill: none; stroke-width: 3.5; stroke-linecap: round; }
    .bar  { fill: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #6366f1; }
      .bar  { fill: #6366f1; }
    }
  </style>
  <g class="mark">
    <rect x="3.5" y="6" width="25" height="23" rx="5"/>
    <path d="M3.5 13.5H28.5"/>
    <path d="M10.5 3v5M21.5 3v5"/>
  </g>
  <rect class="bar" x="9" y="18.5" width="14" height="5" rx="2.5"/>
</svg>
