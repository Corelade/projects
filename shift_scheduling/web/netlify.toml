[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The build emits into dist/shiftpro, so everything under /shiftpro/ is a real
# file. Netlify serves an existing file in preference to a 200 rewrite, which
# leaves the fallback below to catch only client-side routes.

# The app lives under /shiftpro/; nothing is published at the bare root.
# `force` so a stale dist/index.html from an older local build can't shadow this.
[[redirects]]
  from = "/"
  to = "/shiftpro/"
  status = 302
  force = true

# SPA fallback so client-side routes such as /shiftpro/staff/3/edit resolve.
[[redirects]]
  from = "/shiftpro/*"
  to = "/shiftpro/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Vite emits content-hashed filenames, so these are safe to cache forever.
[[headers]]
  for = "/shiftpro/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
